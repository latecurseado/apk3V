name: Build Android APK

# Compila el APK de Tres Valles en la nube (sin instalar nada en tu PC).
# Se dispara al hacer push o manualmente (Actions -> Build Android APK -> Run workflow).
# El APK queda en la pestaña Actions -> el run -> "Artifacts" -> tresvalles-debug-apk.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-poc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: astro-poc/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Variables de entorno (Supabase · publishable key, segura)
        run: |
          echo "PUBLIC_SUPABASE_URL=https://iaqnnphzopxlkzylbals.supabase.co" > .env
          echo "PUBLIC_SUPABASE_KEY=sb_publishable_gotsvOCmL336D_8l3YJvpw_oOx5pAHx" >> .env

      - name: Build web (Astro)
        run: npx astro build

      - name: Sync Capacitor (Android)
        run: npx cap sync android

      - name: Compilar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: tresvalles-debug-apk
          path: astro-poc/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
